AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Project Penguin backend foundation. DynamoDB tables for the community goal (prod and dev) with
  maximum on-demand throughput, least-privilege managed policies for Nova 2 Lite photo judging and
  table access, IAM roles that the Vercel Functions assume through Vercel OIDC (production and
  preview are separate, no long-lived access keys), and alarms that email the owner on unusual usage.
  Decisions: project-penguin docs/adr/0001, 0002, 0003. Deployed only by the account owner.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    why: >-
      Hack Day の backend (Vercel の FastAPI) が写真判定とみんなの氷山に使う AWS 側の土台。
      開発者グループ (project-penguin の infra/account.yaml) はここが出す管理ポリシーを import して付ける。
    must:
      - アカウント ID・Vercel のチーム名を文字で書かない (このリポジトリは public)。チーム名はパラメータで渡す
      - Bedrock は Nova 2 Lite の jp. 推論プロファイルだけを許す (写真を国内で処理し、高いモデルを呼ばせない)
      - 長く使えるアクセスキーを作らない。Vercel からは OIDC でロールを借りる
      - preview (PR ごとの公開) から本番のテーブルに触れさせない。ロールを環境ごとに分ける
      - 通知先のメールアドレスを文字で書かない。パラメータで渡す
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Vercel }
        Parameters: [VercelTeamSlug, VercelProject]
      - Label: { default: 費用の天井と見張り }
        Parameters:
          - AlertEmail
          - ProdMaxReadRequestUnits
          - ProdMaxWriteRequestUnits
          - DevMaxRequestUnits
          - JudgeInvocationsPerHourAlarm

Parameters:
  VercelTeamSlug:
    Type: String
    Description: Vercel のチーム (Hobby なら個人のアカウント) の slug。OIDC の発行者 URL に入る
    AllowedPattern: "^[a-z0-9][a-z0-9-]{0,99}$"
  VercelProject:
    Type: String
    Description: Vercel のプロジェクト名 (OIDC の sub に入る)
    Default: project-penguin
    AllowedPattern: "^[a-z0-9][a-z0-9._-]{0,99}$"
  AlertEmail:
    Type: String
    Description: 使いすぎ・絞り込みのアラームを受け取るメールアドレス (リポジトリに書かず、infra/backend.local.json で渡す)
    AllowedPattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
  # 本番のテーブルの読み書きの上限 (1 秒あたりの要求単位)。超えた分は絞られ、費用の天井になる。
  # 読み: 1000 人が 10 秒ごとに 10 分割のカウンタを BatchGetItem (結果整合で 1 項目 0.5) すると約 500 (docs/adr/0002)
  # 書き: 1 枚あたり条件付き Put と ADD の 2 単位。検証では最大 380 枚/秒
  ProdMaxReadRequestUnits:
    Type: Number
    Description: 本番のテーブルの読み込みの上限 (1 秒あたりの読み込み要求単位)
    Default: 1000
    MinValue: 1
  ProdMaxWriteRequestUnits:
    Type: Number
    Description: 本番のテーブルの書き込みの上限 (1 秒あたりの書き込み要求単位)
    Default: 1000
    MinValue: 1
  DevMaxRequestUnits:
    Type: Number
    Description: 開発用のテーブルの読み書きの上限 (手元の確認と preview だけなので小さく)
    Default: 100
    MinValue: 1
  JudgeInvocationsPerHourAlarm:
    Type: Number
    Description: Nova 2 Lite の 1 時間の呼び出しがこれを超えたら知らせる (1 回 約 $0.0008、docs/adr/0001)
    Default: 1000
    MinValue: 1

Resources:
  CommunityTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          本番のみんなの氷山。提出の記録 sub#<goal>#<提出 ID> を条件付き Put で 1 回だけ通し、
          通ったときだけ goal#<goal>#s<0-9> に ADD する (docs/adr/0002)。
        must:
          - 写真・個人を識別できる値を入れない。残すのは件数と種類だけ
          - キーを変えると置き換えになり、件数が消える
        mutability:
          KeySchema: immutable
    Properties:
      TableName: !Sub "${AWS::StackName}-community"
      BillingMode: PAY_PER_REQUEST
      # 公開の口が叩き続けられたときの費用の天井。上限は目安で、バースト分は超えることがある
      OnDemandThroughput:
        MaxReadRequestUnits: !Ref ProdMaxReadRequestUnits
        MaxWriteRequestUnits: !Ref ProdMaxWriteRequestUnits
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      SSESpecification: { SSEEnabled: true }
      Tags:
        - { Key: project, Value: penguin }
        - { Key: managed-by, Value: cloudformation }
        - { Key: environment, Value: production }

  CommunityDevTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          手元の開発と Vercel の preview が使う。本番と同じ形で、中身は捨ててよい。
          PITR は中身が小さく費用がほぼかからないので、cfn-guard の DYNAMODB_PITR_ENABLED (抑止に対応していない) に合わせて付ける
    Properties:
      TableName: !Sub "${AWS::StackName}-community-dev"
      BillingMode: PAY_PER_REQUEST
      OnDemandThroughput:
        MaxReadRequestUnits: !Ref DevMaxRequestUnits
        MaxWriteRequestUnits: !Ref DevMaxRequestUnits
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      SSESpecification: { SSEEnabled: true }
      Tags:
        - { Key: project, Value: penguin }
        - { Key: managed-by, Value: cloudformation }
        - { Key: environment, Value: development }

  NovaInvokePolicy:
    Type: AWS::IAM::ManagedPolicy
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          写真判定 (docs/adr/0001) に要る呼び出しだけ。Vercel のロールと開発者グループの両方に付ける。
          jp. のプロファイルは東京と大阪に振り分けるので、モデル側はプロファイル経由に限ってリージョンを絞らない
        must:
          - ほかのモデル・global. のプロファイルを足さない (足すなら ADR を更新する)
    Properties:
      Description: Invoke Amazon Nova 2 Lite only through the jp. inference profile
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: InvokeJpInferenceProfile
            Effect: Allow
            Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
            Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/jp.amazon.nova-2-lite-v1:0"
          - Sid: InvokeModelThroughJpProfileOnly
            Effect: Allow
            Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
            Resource: !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/amazon.nova-2-lite-v1:0"
            Condition:
              StringEquals:
                bedrock:InferenceProfileArn: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/jp.amazon.nova-2-lite-v1:0"

  CommunityDevTablePolicy:
    Type: AWS::IAM::ManagedPolicy
    Metadata:
      com.aws.cloudformation.Context:
        why: 開発者グループが開発用テーブルだけを読み書きする。本番のテーブルは Vercel のロールだけが触る
    Properties:
      Description: Read and write the development community table only
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DevTableReadWrite
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:BatchGetItem
              - dynamodb:Query
              - dynamodb:Scan
              - dynamodb:DescribeTable
            Resource: !GetAtt CommunityDevTable.Arn
          - Sid: ListTablesForConsole
            Effect: Allow
            Action: dynamodb:ListTables
            Resource: "*"

  CommunityCountPolicy:
    Type: AWS::IAM::ManagedPolicy
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          production のロールが、本番のテーブルで提出の記録の条件付き Put と分割カウンタの ADD・読み出しをする (docs/adr/0002)。
          インラインにせず管理ポリシーにする (cfn-guard の IAM_NO_INLINE_POLICY_CHECK)
        must:
          - 消す・Scan する権限を足さない
          - 開発用のテーブルを足さない (preview 用は CommunityCountDevPolicy)
    Properties:
      Description: Count community goal submissions in the production table
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CountSubmissions
            Effect: Allow
            Action: [dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:BatchGetItem, dynamodb:GetItem]
            Resource: !GetAtt CommunityTable.Arn

  CommunityCountDevPolicy:
    Type: AWS::IAM::ManagedPolicy
    Metadata:
      com.aws.cloudformation.Context:
        why: preview のロールが、開発用のテーブルで本番と同じ数え方をする
        must:
          - 本番のテーブルを足さない (preview は PR ごとに公開され、誰のコードでも動く)
    Properties:
      Description: Count community goal submissions in the development table
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CountSubmissions
            Effect: Allow
            Action: [dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:BatchGetItem, dynamodb:GetItem]
            Resource: !GetAtt CommunityDevTable.Arn

  VercelOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Metadata:
      com.aws.cloudformation.Context:
        why: Vercel Functions の OIDC トークンを STS で受け付ける (https://vercel.com/docs/oidc/aws、チームの発行者モード)
        must:
          - 発行者 URL を変えると置き換えになり、ロールの信頼ポリシーも合わせて変わる
    Properties:
      Url: !Sub "https://oidc.vercel.com/${VercelTeamSlug}"
      ClientIdList:
        - !Sub "https://vercel.com/${VercelTeamSlug}"
      Tags:
        - { Key: project, Value: penguin }
        - { Key: managed-by, Value: cloudformation }

  VercelBackendRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          production の backend が x-vercel-oidc-token の値で AssumeRoleWithWebIdentity して使う。
          preview は VercelPreviewRole を使う (Vercel の PENGUIN_AWS_ROLE_ARN を環境ごとに分けて入れる)
        must:
          - sub は完全一致で、このプロジェクトの production だけに限る
          - 付ける権限は Nova の呼び出しと本番のテーブルの数え上げだけ
    Properties:
      Description: Assumed by the production Vercel Functions of the Project Penguin backend via OIDC
      MaxSessionDuration: 3600
      # Condition のキーにチーム名が入り、YAML のキーには !Sub を使えないので、JSON の文字列で組む
      AssumeRolePolicyDocument: !Sub
        - |
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Principal": { "Federated": "${ProviderArn}" },
                "Action": "sts:AssumeRoleWithWebIdentity",
                "Condition": {
                  "StringEquals": {
                    "oidc.vercel.com/${VercelTeamSlug}:aud": "https://vercel.com/${VercelTeamSlug}",
                    "oidc.vercel.com/${VercelTeamSlug}:sub": "owner:${VercelTeamSlug}:project:${VercelProject}:environment:production"
                  }
                }
              }
            ]
          }
        - ProviderArn: !GetAtt VercelOidcProvider.Arn
      ManagedPolicyArns:
        - !Ref NovaInvokePolicy
        - !Ref CommunityCountPolicy
      Tags:
        - { Key: project, Value: penguin }
        - { Key: managed-by, Value: cloudformation }
        - { Key: environment, Value: production }

  VercelPreviewRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          preview (PR ごとの公開) の backend が借りる。本番のロールと分け、開発用のテーブルだけに触れる。
          Nova の呼び出しは判定を preview で確かめるために許す (費用はアラームで見張る)
        must:
          - sub は完全一致で、このプロジェクトの preview だけに限る
          - 本番のテーブルの権限を付けない
    Properties:
      Description: Assumed by the preview Vercel Functions of the Project Penguin backend via OIDC
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument: !Sub
        - |
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Principal": { "Federated": "${ProviderArn}" },
                "Action": "sts:AssumeRoleWithWebIdentity",
                "Condition": {
                  "StringEquals": {
                    "oidc.vercel.com/${VercelTeamSlug}:aud": "https://vercel.com/${VercelTeamSlug}",
                    "oidc.vercel.com/${VercelTeamSlug}:sub": "owner:${VercelTeamSlug}:project:${VercelProject}:environment:preview"
                  }
                }
              }
            ]
          }
        - ProviderArn: !GetAtt VercelOidcProvider.Arn
      ManagedPolicyArns:
        - !Ref NovaInvokePolicy
        - !Ref CommunityCountDevPolicy
      Tags:
        - { Key: project, Value: penguin }
        - { Key: managed-by, Value: cloudformation }
        - { Key: environment, Value: preview }

  AlertTopic:
    Type: AWS::SNS::Topic
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          下のアラームをオーナーのメールに届ける。予算の通知 (infra/account.yaml) は請求に載るまで遅れるので、
          呼び出しの急増と絞り込みは数分で分かるこちらで見る。中身は指標の名前と値だけなので、KMS では暗号化しない
          (CloudWatch から暗号化した SNS に送るには、AWS 管理のキーでは足りず、カスタマー管理のキーが要る)
        must:
          - 購読の確認メールのリンクを開くまで届かない
    Properties:
      DisplayName: Project Penguin backend alerts
      Tags:
        - { Key: project, Value: penguin }
        - { Key: managed-by, Value: cloudformation }

  AlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  JudgeInvocationsHighAlarm:
    Type: AWS::CloudWatch::Alarm
    Metadata:
      com.aws.cloudformation.Context:
        why: >-
          判定の口は認証が無く、呼ばれた分だけ Nova の料金がかかる (project-penguin #136 の 3)。
          ModelId の次元を付けない全体の値で見る (Bedrock の文書の勧め。モデルが決まる前に落ちた要求も入る)。
          開発者グループの手元からの呼び出しも数える
    Properties:
      AlarmDescription: Bedrock invocations in the last hour exceeded the expected demo volume
      Namespace: AWS/Bedrock
      MetricName: Invocations
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: !Ref JudgeInvocationsPerHourAlarm
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  JudgeThrottledAlarm:
    Type: AWS::CloudWatch::Alarm
    Metadata:
      com.aws.cloudformation.Context:
        why: Nova の割り当て (1 分 2,000 回) に当たり始めたら、判定が固定判定に落ちているので知らせる
    Properties:
      AlarmDescription: Bedrock throttled invocations in the last 5 minutes
      Namespace: AWS/Bedrock
      MetricName: InvocationThrottles
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  CommunityReadCappedAlarm:
    Type: AWS::CloudWatch::Alarm
    Metadata:
      com.aws.cloudformation.Context:
        why: 本番のテーブルの読み込みが上限 (ProdMaxReadRequestUnits) で絞られ始めた。ゲージの取得が止まっている
    Properties:
      AlarmDescription: Reads on the production community table are throttled by the maximum on-demand throughput
      Namespace: AWS/DynamoDB
      MetricName: ReadMaxOnDemandThroughputThrottleEvents
      Dimensions:
        - { Name: TableName, Value: !Ref CommunityTable }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  CommunityWriteCappedAlarm:
    Type: AWS::CloudWatch::Alarm
    Metadata:
      com.aws.cloudformation.Context:
        why: 本番のテーブルの書き込みが上限 (ProdMaxWriteRequestUnits) で絞られ始めた。写真が氷山に数えられていない
    Properties:
      AlarmDescription: Writes on the production community table are throttled by the maximum on-demand throughput
      Namespace: AWS/DynamoDB
      MetricName: WriteMaxOnDemandThroughputThrottleEvents
      Dimensions:
        - { Name: TableName, Value: !Ref CommunityTable }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

Outputs:
  CommunityTableName:
    Description: 本番のみんなの氷山のテーブル (Vercel の production の PENGUIN_COMMUNITY_TABLE)
    Value: !Ref CommunityTable
  CommunityDevTableName:
    Description: 開発用のテーブル (手元と Vercel の preview の PENGUIN_COMMUNITY_TABLE)
    Value: !Ref CommunityDevTable
  VercelBackendRoleArn:
    Description: Vercel の production の PENGUIN_AWS_ROLE_ARN に入れるロール
    Value: !GetAtt VercelBackendRole.Arn
  VercelPreviewRoleArn:
    Description: Vercel の preview の PENGUIN_AWS_ROLE_ARN に入れるロール
    Value: !GetAtt VercelPreviewRole.Arn
  NovaInvokePolicyArn:
    Description: Nova 2 Lite の呼び出しだけを許す管理ポリシー (infra/account.yaml の開発者グループが使う)
    Value: !Ref NovaInvokePolicy
    Export:
      Name: !Sub "${AWS::StackName}-NovaInvokePolicyArn"
  CommunityDevTablePolicyArn:
    Description: 開発用のテーブルだけを読み書きする管理ポリシー (infra/account.yaml の開発者グループが使う)
    Value: !Ref CommunityDevTablePolicy
    Export:
      Name: !Sub "${AWS::StackName}-CommunityDevTablePolicyArn"
