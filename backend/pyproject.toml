[project]
name = "project-penguin-backend"
version = "0.1.0"
description = "エコ写真の判定とみんなの氷山を受け持つ Project Penguin のバックエンド"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.146.0",
    "pydantic-settings>=2.16.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "uvicorn>=0.54.0",
    # FastAPI の TestClient (starlette.testclient) が使う HTTP クライアント。httpx の後継で、
    # Pydantic が保守する (https://github.com/pydantic/httpx2)。Starlette 1.9 は httpx を非推奨とし、
    # httpx2 を入れるよう案内している。名前は似ているが typosquat ではない (2026-10-19 に来歴を確認)。
    "httpx2>=2.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/penguin_backend"]

# ---------------------------------------------------------------
# ruff (lint + formatter)
# ---------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import の並び
    "N",        # 命名規約
    "UP",       # 新しい構文への追従
    "B",        # bugbear
    "A",        # 組み込み名のシャドウ
    "C4",       # 内包表記
    "SIM",      # 冗長な分岐
    "RUF",
    "ANN",      # 型注釈の欠落
    "S",        # bandit (セキュリティ)
    "T20",      # print の禁止
]
ignore = [
    "ANN401",  # *args/**kwargs の Any は許容する
]

# S (bandit) と T20 (print 禁止) は、レシート画像・購買明細を
# ログや標準出力に漏らさないという制約を機械的に守らせるために入れている。
# 外す場合は .claude/rules/privacy.md の前提が崩れないか確認すること。

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN"]  # assert と型注釈の省略はテストでは許容

[tool.ruff.lint.isort]
known-first-party = ["penguin_backend"]

# ---------------------------------------------------------------
# mypy
# ---------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
warn_unreachable = true
show_error_codes = true

# ---------------------------------------------------------------
# pytest
# ---------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
