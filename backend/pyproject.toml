[project]
name = "project-penguin-backend"
version = "0.1.0"
description = "エコ写真の判定とみんなの氷山を受け持つ Project Penguin のバックエンド"
requires-python = ">=3.11"
dependencies = [
    # 写真判定 (Bedrock の Nova 2 Lite) とみんなの氷山 (DynamoDB) を呼ぶ (project-penguin の docs/adr/0001・0002)
    "boto3>=1.43",
    "fastapi>=0.146.0",
    "pydantic-settings>=2.16.0",
    # 写真判定の本文 (multipart/form-data、api/openapi.yaml の judgeEcoPhoto) を FastAPI が読むのに要る
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "uvicorn>=0.54.0",
    # FastAPI の TestClient (starlette.testclient) が使う HTTP クライアント。httpx の後継で、
    # Pydantic が保守する (https://github.com/pydantic/httpx2)。Starlette 1.9 は httpx を非推奨とし、
    # httpx2 を入れるよう案内している。名前は似ているが typosquat ではない (2026-10-19 に来歴を確認)。
    "httpx2>=2.14.0",
    # DynamoDB の条件付き Put・ADD と STS (Vercel の OIDC) を、本物と同じ規則で手元で動かす偽物 (tests/support/)。
    # Bedrock は moto に無いので botocore の Stubber を使う
    "moto[dynamodb,sts]==5.2.4",
    # mypy --strict が boto3 のクライアントの型を見られるようにする
    "boto3-stubs[bedrock-runtime,dynamodb,sts]>=1.43",
    # 応答を契約 (api/openapi.yaml) のスキーマで検証し、infra/backend.yaml を読む。エラーの code の表は
    # scripts/check_api_contract.py から読み込んで二重に持たない (そのため同じ版を揃える)
    "jsonschema==4.26.0",
    "openapi-spec-validator==0.9.0",
    "pyyaml==6.0.3",
    "types-pyyaml>=6.0.12",
    # 本物の AWS に当てるテスト (印 aws) が、aws login の認証情報を読むのに要る
    "botocore[crt]>=1.43.116",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/penguin_backend"]

# ---------------------------------------------------------------
# ruff (lint + formatter)
# ---------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import の並び
    "N",        # 命名規約
    "UP",       # 新しい構文への追従
    "B",        # bugbear
    "A",        # 組み込み名のシャドウ
    "C4",       # 内包表記
    "SIM",      # 冗長な分岐
    "RUF",
    "ANN",      # 型注釈の欠落
    "S",        # bandit (セキュリティ)
    "T20",      # print の禁止
]
ignore = [
    "ANN401",  # *args/**kwargs の Any は許容する
]

# S (bandit) と T20 (print 禁止) は、レシート画像・購買明細を
# ログや標準出力に漏らさないという制約を機械的に守らせるために入れている。
# 外す場合は .claude/rules/privacy.md の前提が崩れないか確認すること。

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN"]  # assert と型注釈の省略はテストでは許容

[tool.ruff.lint.isort]
known-first-party = ["penguin_backend"]

# ---------------------------------------------------------------
# pyright (pyright-lsp プラグインのコードの解析。型の検査の正は mypy)
# ---------------------------------------------------------------
[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["."]

# ---------------------------------------------------------------
# mypy
# ---------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
warn_unreachable = true
show_error_codes = true

# ---------------------------------------------------------------
# pytest
# ---------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    # 本物の AWS (Nova 2 Lite と開発用テーブル) に当てる。PENGUIN_TEST_AWS=1 を付けたときだけ動き、CI では動かない
    "aws: 本物の AWS に当てるテスト",
]
