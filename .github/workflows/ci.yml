# ---------------------------------------------------------------
# tkb_2611 (ueco / Project Penguin の backend) - CI
#   Unity クライアントは Sh1n1230/project-penguin にあり、ここでは回さない。
# ---------------------------------------------------------------
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: 秘密情報の検査
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: 追跡対象ファイルの検査
        run: python scripts/check_secrets.py

      # gitleaks-action は org のリポジトリではライセンスキーが要るので、gitleaks 本体 (MIT) を
      # 版と checksum を固定して直接動かす。
      - name: gitleaks (履歴全体)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner --exit-code 1 .

  contract:
    name: Unity との契約 (api/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.12'

      # Web ビルドは作り直さないので、契約を壊す変更 (必須の項目を足す・例がスキーマに合わない) をここで止める。
      - name: 契約の検査
        run: >-
          uv run --no-project --with openapi-spec-validator==0.9.0
          --with jsonschema==4.26.0 --with pyyaml==6.0.3 python scripts/check_api_contract.py

  backend:
    name: backend (lint / format / type / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - run: uv sync --all-extras --dev
      - name: format (ruff format --check)
        run: uv run ruff format --check .
      - name: lint (ruff check)
        run: uv run ruff check .
      - name: type-check (mypy)
        run: uv run mypy .
      - name: unit test (pytest)
        run: uv run pytest -q
